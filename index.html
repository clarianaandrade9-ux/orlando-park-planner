<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5b45d6"><title>Orlando Trip Planner 2.0</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="topbar"><button id="menuBtn" class="icon-btn" aria-label="Abrir menu">☰</button><div><strong>Orlando Trip Planner</strong><small id="syncState">Modo local</small></div><div class="top-actions"><button id="loginBtn" class="btn">Entrar com Google</button><button id="logoutBtn" class="btn ghost hidden">Sair</button></div></header>
  <aside id="sidebar" class="sidebar"><nav id="nav"></nav></aside>
  <main id="app" tabindex="-1"></main>
  <nav id="mobileNav" class="mobile-nav"></nav>
  <dialog id="modal"><form method="dialog" class="modal-card"><button class="modal-close" value="cancel">×</button><div id="modalBody"></div></form></dialog>
  <input id="importFile" type="file" accept="application/json" hidden>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
